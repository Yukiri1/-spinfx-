<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipCraft Studio</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <header class="hero panel">
        <p class="eyebrow">AI short-form studio</p>
        <h1>Paste a YouTube link. Pick your best clip.</h1>
        <p>
          ClipCraft analyzes transcript signals and gives you ready-to-edit moments.
          Click <strong>Edit this clip</strong> to open the full editor page.
        </p>

        <div class="auth-row">
          <button id="googleLoginButton" class="ghost-btn" type="button">Sign in with Google</button>
          <button id="logoutButton" class="ghost-btn hidden" type="button">Logout</button>
          <span id="authUserLabel" class="help-text"></span>
        </div>
      </header>

      <main>
        <section class="panel">
          <h2>1) Analyze a video</h2>
          <form id="clipForm" class="clip-form">
            <label for="videoUrls">YouTube URL(s)</label>
            <textarea id="videoUrls" rows="3" placeholder="https://www.youtube.com/watch?v=..." required></textarea>

            <div class="row">
              <div>
                <label for="aspectRatio">Default aspect ratio</label>
                <select id="aspectRatio">
                  <option value="9:16">9:16 (Shorts/Reels)</option>
                  <option value="1:1">1:1 (Square)</option>
                  <option value="16:9">16:9 (Landscape)</option>
                </select>
              </div>
              <div>
                <label for="tone">Clip strategy</label>
                <select id="tone">
                  <option>Most engaging</option>
                  <option>Educational nuggets</option>
                  <option>Funny moments</option>
                  <option>Emotional peaks</option>
                </select>
              </div>
            </div>
            <button class="primary" type="submit">Find best moments</button>
          </form>
          <p id="statusText" class="status-text">Ready.</p>
        </section>

        <section class="panel">
          <div class="section-head">
            <h2>2) Suggested clips</h2>
            <p class="help-text">Choose a clip to continue on the dedicated editor page.</p>
          </div>
          <div class="results-grid" id="resultsGrid"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
